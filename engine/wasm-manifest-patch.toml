# Merged into the wasm crate ubrn generates from ubrn.config.yaml.

[dependencies]
# Must match the wasm-bindgen CLI that runs over the build. The generated
# template asks for "*", which resolves to the latest release, and a library/CLI
# mismatch fails at runtime with "unreachable" panics.
wasm-bindgen = "=0.2.108"

# uniffi_core 0.31 needs this on wasm32 to drop the Send bound on futures, which
# single-threaded wasm cannot satisfy.
[dependencies.uniffi_core]
version = "0.31"
default-features = false
features = ["wasm-unstable-single-threaded"]
